name: Build downloadable applications

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulsenet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
          go test ./...
          go vet ./...

      - name: Validate installer scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('Install-PulseNet.ps1', 'Uninstall-PulseNet.ps1')) {
            $tokens = $null
            $errors = $null
            $resolvedPath = (Resolve-Path $path).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($resolvedPath, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Build and package
        shell: bash
        env:
          VERSION: 2.3.0
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            extension=""
            if [ "$os" = "windows" ]; then extension=".exe"; fi
            output="pulsenet-${os}-${arch}${extension}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${output}" ./cmd/pulsenet
            if [ "$os" = "windows" ]; then
              zip -j "dist/pulsenet-${os}-${arch}.zip" "dist/${output}" README.md LICENSE
            else
              tar -czf "dist/pulsenet-${os}-${arch}.tar.gz" -C dist "${output}"
            fi
          done
          cp dist/pulsenet-windows-amd64.exe dist/PulseNet.exe
          cp Install-PulseNet.ps1 dist/Install-PulseNet.ps1
          cp Uninstall-PulseNet.ps1 dist/Uninstall-PulseNet.ps1
          zip -j dist/PulseNet-Windows.zip dist/PulseNet.exe Install-PulseNet.ps1 Uninstall-PulseNet.ps1 README.md LICENSE
          ./dist/pulsenet-linux-amd64 version
          ./dist/pulsenet-linux-amd64 db tools --json >/dev/null

      - name: Create and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | LC_ALL=C sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 2.3.0
        run: |
          set -euo pipefail
          tag="v${VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PulseNet ${VERSION}" --generate-notes
