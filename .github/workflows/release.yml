name: Build downloadable applications

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulsenet-download-release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build and package
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: 0
          VERSION: 2.0.0
        run: |
          mkdir -p dist
          BASE="pulsenet-${GOOS}-${GOARCH}"
          OUTPUT="${BASE}${EXT}"

          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${OUTPUT}" \
            ./cmd/pulsenet

          if [ "${GOOS}" = "windows" ]; then
            zip -j "dist/${BASE}.zip" "dist/${OUTPUT}" README.md LICENSE

            if [ "${GOARCH}" = "amd64" ]; then
              cp "dist/${OUTPUT}" "dist/PulseNet.exe"
              zip -j "dist/PulseNet-Windows.zip" "dist/PulseNet.exe" README.md LICENSE
            fi
          else
            tar -czf "dist/${BASE}.tar.gz" -C dist "${OUTPUT}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pulsenet-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Downloads

          **Most Windows computers:** download `PulseNet.exe` and open it.

          A packaged Windows ZIP, architecture-specific builds, Linux builds, macOS builds, and SHA-256 checksums are also attached below.

          The complete source code remains available in the repository for modification and custom builds.

          > PulseNet is currently unsigned. Windows SmartScreen may show an unknown-publisher warning.
          EOF

      - name: Publish downloadable applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}" --force

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" \
              --title "PulseNet — Download" \
              --notes-file RELEASE_NOTES.md \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "PulseNet — Download" \
              --notes-file RELEASE_NOTES.md \
              --repo "${GITHUB_REPOSITORY}"
          fi
