name: Temporary build diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run Go diagnostics
        id: diagnostic
        shell: bash
        run: |
          set +e
          {
            echo "Commit: $GITHUB_SHA"
            echo
            echo "== gofmt =="
            gofmt -w ./cmd ./internal
            format_exit=$?
            echo "gofmt exit: $format_exit"
            echo
            echo "== go test =="
            go test ./...
            test_exit=$?
            echo "go test exit: $test_exit"
            echo
            echo "== go vet =="
            go vet ./...
            vet_exit=$?
            echo "go vet exit: $vet_exit"
            echo
            echo "== windows build =="
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=2.4.0" -o /tmp/PulseNet.exe ./cmd/pulsenet
            build_exit=$?
            echo "windows build exit: $build_exit"
            echo
            echo "== Linux smoke test =="
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=2.4.0" -o /tmp/pulsenet ./cmd/pulsenet
            linux_build_exit=$?
            if [ "$linux_build_exit" -eq 0 ]; then
              /tmp/pulsenet version
              /tmp/pulsenet integrity --json
              smoke_exit=$?
            else
              smoke_exit=$linux_build_exit
            fi
            echo "smoke exit: $smoke_exit"
            echo
            if [ "$format_exit" -eq 0 ] && [ "$test_exit" -eq 0 ] && [ "$vet_exit" -eq 0 ] && [ "$build_exit" -eq 0 ] && [ "$smoke_exit" -eq 0 ]; then
              echo "GO_RESULT=SUCCESS"
              final_exit=0
            else
              echo "GO_RESULT=FAILURE"
              final_exit=1
            fi
          } > diagnostic.txt 2>&1
          cat diagnostic.txt
          echo "exit_code=$final_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run PowerShell diagnostics
        id: powershell
        shell: pwsh
        run: |
          $failed = $false
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('== PowerShell parser ==')
          foreach ($path in @('Install-PulseNet.ps1', 'Uninstall-PulseNet.ps1')) {
            $tokens = $null
            $errors = $null
            $resolvedPath = (Resolve-Path $path).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($resolvedPath, [ref]$tokens, [ref]$errors)
            if ($errors.Count -eq 0) {
              $lines.Add("$path`: OK")
            }
            else {
              $failed = $true
              $lines.Add("$path`: FAILED")
              foreach ($errorItem in $errors) {
                $lines.Add("  line $($errorItem.Extent.StartLineNumber): $($errorItem.Message)")
              }
            }
          }
          $lines | Set-Content -LiteralPath ps-diagnostic.txt -Encoding UTF8
          $lines | ForEach-Object { Write-Host $_ }
          if ($failed) {
            'exit_code=1' | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          }
          else {
            'exit_code=0' | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Publish diagnostic issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GO_EXIT: ${{ steps.diagnostic.outputs.exit_code }}
          PS_EXIT: ${{ steps.powershell.outputs.exit_code }}
        run: |
          title="Build diagnostic ${GITHUB_SHA::12}"
          {
            echo '```text'
            sed -n '1,500p' diagnostic.txt
            echo
            sed -n '1,200p' ps-diagnostic.txt
            echo
            echo "Go exit: $GO_EXIT"
            echo "PowerShell exit: $PS_EXIT"
            echo '```'
          } > issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md

      - name: Fail when verification failed
        if: steps.diagnostic.outputs.exit_code != '0' || steps.powershell.outputs.exit_code != '0'
        run: exit 1
